<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Weather Combined Live</title>
  <style>
    :root{
      --panel: #071222;
      --panel-2: #081428;
      --border: rgba(95, 130, 205, 0.14);
      --text: #f2f6ff;
      --muted: rgba(223, 232, 255, 0.80);

      --alert-none-bg: rgba(55, 95, 150, 0.08);
      --alert-none-border: rgba(85, 125, 195, 0.16);
      --alert-none-dot: #4ed267;

      --alert-yellow-bg: rgba(255, 214, 10, 0.10);
      --alert-yellow-border: rgba(255, 214, 10, 0.28);
      --alert-yellow-icon: #fff200;

      --alert-orange-bg: rgba(255, 166, 0, 0.11);
      --alert-orange-border: rgba(255, 166, 0, 0.30);
      --alert-orange-icon: #ffa300;

      --alert-red-bg: rgba(220, 40, 40, 0.12);
      --alert-red-border: rgba(239, 68, 68, 0.30);
      --alert-red-icon: #e10600;

      --aqhi-low-accent: #1499d3;
      --aqhi-low-bg-top: rgba(20, 153, 211, 0.10);
      --aqhi-low-bg-bottom: rgba(20, 153, 211, 0.04);
      --aqhi-low-border: rgba(20, 153, 211, 0.26);

      --aqhi-moderate-accent: #ffc323;
      --aqhi-moderate-bg-top: rgba(255, 195, 35, 0.12);
      --aqhi-moderate-bg-bottom: rgba(255, 195, 35, 0.05);
      --aqhi-moderate-border: rgba(255, 195, 35, 0.28);

      --aqhi-high-accent: #ff5b5b;
      --aqhi-high-bg-top: rgba(255, 91, 91, 0.12);
      --aqhi-high-bg-bottom: rgba(255, 91, 91, 0.05);
      --aqhi-high-border: rgba(255, 91, 91, 0.28);

      --aqhi-veryhigh-accent: #ad0000;
      --aqhi-veryhigh-bg-top: rgba(173, 0, 0, 0.13);
      --aqhi-veryhigh-bg-bottom: rgba(173, 0, 0, 0.05);
      --aqhi-veryhigh-border: rgba(173, 0, 0, 0.28);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at top right, rgba(22, 103, 165, 0.10), transparent 34%),
        linear-gradient(180deg, rgba(255,255,255,0.008), rgba(255,255,255,0)),
        linear-gradient(180deg, #050e1d, #040914);
      color: var(--text);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      overflow: hidden;
      border: 0;
      outline: 0;
      box-shadow: none;
    }

    body {
      padding: 10px;
    }

    .card {
      width: 100%;
      height: 100%;
      border: 0 !important;
      outline: 0 !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      overflow: hidden;
      position: relative;
      isolation: isolate;
      background: transparent;
      -webkit-mask-image: none !important;
      mask-image: none !important;
      padding: 0;
      display: grid;
      grid-template-rows: auto auto auto;
      gap: 8px;
      contain: layout paint;
    }

    .top {
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(0, 0.92fr);
      gap: 10px;
      min-width: 0;
      align-items: start;
    }

    .left-top {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .title {
      font-size: 19px;
      font-weight: 800;
      line-height: 1.05;
      margin: 0 0 4px;
      letter-spacing: 0.1px;
    }

    .updated {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.15;
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hero {
      min-width: 0;
      display: flex;
      flex-direction: column;
      padding-bottom: 2px;
    }

    .hero-main {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .temp {
      font-size: 58px;
      font-weight: 900;
      line-height: 0.92;
      letter-spacing: -1.4px;
      margin: 0;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .temp-icon-wrap {
      width: 64px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .temp-icon-wrap img {
      width: 60px;
      height: 60px;
      object-fit: contain;
      display: block;
    }

    .status-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
      margin-top: 3px;
      flex-wrap: wrap;
    }

    .condition {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .precip {
      font-size: 13px;
      line-height: 1.1;
      color: var(--muted);
      white-space: nowrap;
    }

    .feels, .high-low-inline {
      font-size: 14px;
      line-height: 1.15;
      color: var(--muted);
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .right-top {
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-self: stretch;
    }

    .descriptor-space {
      min-height: 116px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-start;
      gap: 6px;
      min-width: 0;
      text-align: right;
      padding-top: 4px;
      background: transparent;
    }

    .descriptor-item {
      width: fit-content;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 3px;
      min-width: 0;
      margin-left: auto;
    }

    .descriptor-title {
      font-size: 14px;
      font-weight: 800;
      line-height: 1.12;
      max-width: 100%;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .descriptor-sub {
      font-size: 11px;
      line-height: 1.18;
      color: var(--muted);
      max-width: 100%;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      word-break: break-word;
    }

    .descriptor-sep {
      width: min(100%, 220px);
      height: 1px;
      background: rgba(120, 160, 255, 0.12);
      margin: 1px 0 2px;
      flex-shrink: 0;
    }

    .middle {
      display: grid;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      grid-template-areas:
        "wind wind wind air air air air uv uv uv"
        "alerts alerts alerts alerts alerts alerts sunset sunset humidity humidity";
      gap: 8px;
      min-width: 0;
      min-height: 0;
      margin-top: 8px;
      align-items: stretch;
    }

    .slot-wind { grid-area: wind; }
    .slot-air { grid-area: air; }
    .slot-uv { grid-area: uv; }
    .slot-alerts { grid-area: alerts; min-width: 0; min-height: 0; }
    .slot-sunset { grid-area: sunset; }
    .slot-humidity { grid-area: humidity; }

    .stat {
      min-height: 54px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0)),
        linear-gradient(180deg, var(--panel), var(--panel-2));
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.02);
      padding: 7px 9px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
      overflow: hidden;
    }

    .stat.air-quality.aqhi-low,
    .stat.uv-low,
    .stat.wind-low {
      border-color: var(--aqhi-low-border);
      background:
        linear-gradient(180deg, var(--aqhi-low-bg-top), var(--aqhi-low-bg-bottom)),
        linear-gradient(180deg, var(--panel), var(--panel-2));
    }

    .stat.air-quality.aqhi-moderate,
    .stat.uv-moderate,
    .stat.wind-moderate {
      border-color: var(--aqhi-moderate-border);
      background:
        linear-gradient(180deg, var(--aqhi-moderate-bg-top), var(--aqhi-moderate-bg-bottom)),
        linear-gradient(180deg, var(--panel), var(--panel-2));
    }

    .stat.air-quality.aqhi-high,
    .stat.uv-high,
    .stat.wind-high {
      border-color: var(--aqhi-high-border);
      background:
        linear-gradient(180deg, var(--aqhi-high-bg-top), var(--aqhi-high-bg-bottom)),
        linear-gradient(180deg, var(--panel), var(--panel-2));
    }

    .stat.air-quality.aqhi-veryhigh,
    .stat.uv-veryhigh,
    .stat.wind-veryhigh {
      border-color: var(--aqhi-veryhigh-border);
      background:
        linear-gradient(180deg, var(--aqhi-veryhigh-bg-top), var(--aqhi-veryhigh-bg-bottom)),
        linear-gradient(180deg, var(--panel), var(--panel-2));
    }

    .stat-label {
      font-size: 10px;
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: 0.78px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 14px;
      font-weight: 800;
      line-height: 1.05;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stat-sub {
      font-size: 11px;
      line-height: 1.12;
      color: var(--muted);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .wind-value-wrap {
      display: flex;
      align-items: baseline;
      gap: 2px;
      min-width: 0;
      flex-wrap: nowrap;
    }

    .wind-main, .wind-dir {
      font-size: 14px;
      font-weight: 800;
      line-height: 1.05;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .wind-unit {
      font-size: 9px;
      font-weight: 700;
      line-height: 1;
      color: var(--muted);
      white-space: nowrap;
      flex-shrink: 0;
      position: relative;
      top: -1px;
    }

    .aqhi-title-line {
      font-size: 10px;
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: 0.78px;
      color: var(--muted);
      margin-bottom: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .aqhi-badge-row {
      display: flex;
      align-items: center;
      min-width: 0;
      margin-bottom: 4px;
    }

    .aqhi-risk-row {
      display: flex;
      align-items: center;
      min-width: 0;
    }

    .aqhi-badge {
      min-width: 31px;
      height: 31px;
      padding: 0 7px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 900;
      line-height: 1;
      background: rgba(255,255,255,0.08);
      border: 2px solid currentColor;
      color: inherit;
      flex-shrink: 0;
    }

    .aqhi-risk {
      font-size
